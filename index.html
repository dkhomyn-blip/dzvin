:root{
  /* Дизайн-система «Живої парафії» (чинна в проєкті): спокійно й поважно, без прийомів магазину.
     Макет: телефон; темний вступ (хрест → вітраж) → світлий схематичний застосунок із нижнім меню. */
  --primary:#1F3A5F;
  --primary-ink:#ffffff;
  --gold:#B8892B;
  --bg:#FAF7F2;
  --card:#ffffff;
  --line:#E4DED2;
  --text:#1C1C1C;
  --muted:#555555;
  --ok:#2E7D4F;
  --warn:#9A5B00;
  --bad:#A3262A;
  --health:#A3262A;
  --repose:#2B2540;
  --night:#030204;
  --display:"Cormorant Garamond", "Noto Serif", Georgia, "Times New Roman", serif;
  --body:system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
html{font-size:17px}
html.big{font-size:20.4px}
body{background:#0b0a10;color:var(--text);font-family:var(--body);line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.device{position:relative;width:100%;height:100%;max-width:430px;margin:0 auto;background:var(--bg);overflow:hidden}
@media (min-width:520px){
  body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#17151d,#050407 70%)}
  .device{height:min(100%,900px);border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 8px #1e1b24}
}

/* ---------- Вступ: хрест і вітраж ---------- */
.intro{position:absolute;inset:0;z-index:20;background:var(--night);overflow:hidden;isolation:isolate;color:#f1e9dc;transition:opacity .5s ease;touch-action:manipulation;cursor:pointer}
.intro.out{opacity:0;pointer-events:none}
.intro .clip{position:absolute;overflow:hidden}
.intro .full{position:absolute}
.intro .full img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
#pieces,#dust{position:absolute;left:0;top:0;pointer-events:none}
#dust{mix-blend-mode:screen}
.lit-cross{-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
#front{opacity:0;will-change:opacity}
#litSpot,#litFull,.halation{opacity:0;will-change:opacity}
.halation{pointer-events:none}
.came{position:absolute;pointer-events:none;opacity:0}
.bloom,.rays{position:absolute;pointer-events:none;mix-blend-mode:screen;will-change:opacity,transform}
.bloom{border-radius:50%;background:radial-gradient(closest-side,rgba(255,236,200,.6),rgba(255,200,125,.22) 38%,rgba(255,170,90,.06) 70%,transparent)}
.rays{opacity:0;-webkit-mask-image:radial-gradient(closest-side,#000 0,rgba(0,0,0,.5) 30%,transparent 100%);mask-image:radial-gradient(closest-side,#000 0,rgba(0,0,0,.5) 30%,transparent 100%)}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 60%,rgba(0,0,0,.45) 100%)}
.scrim{position:absolute;pointer-events:none;background:linear-gradient(transparent,rgba(4,3,6,.66) 42%,rgba(4,3,6,.94));opacity:0}
.final{position:absolute;text-align:center;padding:0 24px;opacity:0}
.final .eyebrow{margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#e9b85c}
.final q{display:block;text-wrap:balance;font-family:var(--display);font-style:italic;font-weight:500;font-size:30px;line-height:1.12;quotes:none;color:#fff3dc;text-shadow:0 2px 24px rgba(0,0,0,.85)}
.final small{display:block;margin-top:8px;font-size:12px;color:#b9b0a3;letter-spacing:.03em}
.enter{margin-top:18px;min-height:48px;padding:0 34px;border:0;border-radius:999px;background:#e9b85c;color:#1d1406;font-weight:700;font-size:16px;cursor:pointer;opacity:0;transform:translateY(6px);transition:opacity .5s ease,transform .5s ease;pointer-events:none}
.enter.on{opacity:1;transform:none;pointer-events:auto}
.hint{position:absolute;left:0;right:0;bottom:34px;text-align:center;font-size:13px;color:#948b80;letter-spacing:.08em;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
.skip{position:absolute;top:14px;right:12px;z-index:3;min-height:44px;padding:0 12px;border:0;background:transparent;color:#7e766c;font-size:13px;cursor:pointer}

/* ---------- Застосунок ---------- */
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.topbar{flex:none;display:flex;align-items:center;gap:4px;height:56px;padding:0 6px 0 8px;background:var(--primary);color:var(--primary-ink)}
.topbar .mark{width:30px;height:30px;margin:0 6px 0 6px;flex:none}
.topbar h1{flex:1;min-width:0;margin:0;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{flex:none;width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:12px;background:transparent;color:inherit;cursor:pointer}
.icon-btn:active{background:rgba(255,255,255,.14)}
.icon-btn svg,.ic{width:24px;height:24px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.strip{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;min-height:26px;padding:2px 12px;background:#EFE8DA;color:#5a5346;font-size:12px;letter-spacing:.02em;text-align:center}
.strip.priest{background:#E3ECF6;color:#1F3A5F;font-weight:600}
.content{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:16px 16px 28px;display:flex;flex-direction:column;gap:14px}
.content > *{flex:none}
.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:60px;border:0;background:transparent;color:#6b665c;font-size:11.5px;font-weight:600;cursor:pointer;padding:4px 0}
.tabs button[aria-current="page"]{color:var(--primary)}
.tabs button[aria-current="page"] .ic{stroke-width:2.3}
.tabs.priest{grid-template-columns:repeat(4,1fr)}

h2{margin:0;font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h3{margin:0;font-size:17px;line-height:1.3;font-weight:700;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12.5px}
.tiny .ic{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:2px}
.sec{margin:6px 0 -6px;font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6b665c}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card.flat{padding:0;gap:0;overflow:hidden}
.card.tint{background:#F3EEE4}
.card.note{background:#EEF3F9;border-color:#D5E0EE}
.card.dash{background:transparent;border-style:dashed;border-color:#C9C1B2}
.row{display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 14px;border:0;border-top:1px solid var(--line);background:transparent;width:100%;text-align:left;cursor:pointer}
.row:first-child{border-top:0}
.row:active{background:#F6F2EA}
.row .ic{flex:none;color:var(--primary)}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column}
.row .t b{font-weight:600;font-size:16px;line-height:1.3}
.row .t span{color:var(--muted);font-size:13.5px;line-height:1.35}
.row .chev{flex:none;color:#A39C8E;width:20px;height:20px}
.row.static{cursor:default}
.row.static:active{background:transparent}
.time{flex:none;width:52px;font-variant-numeric:tabular-nums;font-weight:700;color:var(--primary)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid var(--primary);background:var(--primary);color:#fff;font-weight:700;font-size:16px;cursor:pointer;text-align:center;text-decoration:none}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:transparent;color:var(--primary)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--primary);font-weight:600}
.btn.block{display:flex;width:100%}
.btn .ic{width:20px;height:20px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns > .btn{flex:1 1 140px;padding:0 10px;white-space:nowrap;font-size:15.5px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;line-height:1.5;background:#ECE7DC;color:#5a5346;white-space:nowrap}
.pill.ok{background:#E3F1E8;color:var(--ok)}
.pill.warn{background:#FBEFD9;color:var(--warn)}
.pill.bad{background:#F8E3E3;color:var(--bad)}
.pill.info{background:#E3ECF6;color:var(--primary)}
.pill.ex{background:transparent;border:1px dashed #B9B1A2;color:#6b665c;font-weight:600}
.ph{position:relative;display:grid;place-items:center;min-height:120px;border:1.5px dashed #BDB5A6;border-radius:12px;color:#6b665c;font-size:13px;text-align:center;padding:10px;
  background:repeating-linear-gradient(135deg,#F3EEE4 0 10px,#EBE5D8 10px 20px)}
.ph.sm{min-height:72px}
.ph.map{min-height:150px}
.sk{display:flex;flex-direction:column;gap:9px;padding:2px 0}
.sk i{display:block;height:10px;border-radius:6px;background:#E6E0D4}
.sk i:nth-child(3n){width:72%}
.sk i:nth-child(4n+1){width:94%}
.sk i.hl{background:#EAD9B0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13.5px;font-weight:600;color:#3c3a36}
.field .box{display:flex;align-items:center;gap:10px;min-height:50px;padding:0 14px;border:1.5px solid #CFC7B8;border-radius:12px;background:#fff;color:#1C1C1C;font-size:16px}
.field .box.pl{color:#8a8477}
.field .box .ic{color:#8a8477;width:20px;height:20px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid #CFC7B8;background:#fff;font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--primary);background:var(--primary);color:#fff}
.chip.name{background:#F3EEE4;border-color:#DDD5C5;cursor:default}
.chip.name button{border:0;background:transparent;padding:0;margin:0 -6px 0 2px;width:28px;height:28px;display:grid;place-items:center;color:#6b665c;cursor:pointer}
.chip.name button .ic{width:16px;height:16px}
.steps{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.steps i{flex:1;height:4px;border-radius:4px;background:#E0D9CB}
.steps i.on{background:var(--primary)}
.steps span{flex:none;margin-left:6px}
.progress{height:10px;border-radius:8px;background:#ECE6D9;overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold);border-radius:8px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.kv span{flex:none;max-width:48%}
.kv b{font-variant-numeric:tabular-nums;text-align:right}
.sum{font-size:26px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.15}
.sum small{font-size:15px;font-weight:500;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big-choice{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-height:132px;padding:16px;border-radius:16px;border:2px solid;background:#fff;cursor:pointer;text-align:left}
.big-choice b{font-size:19px;line-height:1.2}
.big-choice span{font-size:13.5px;color:var(--muted);line-height:1.35}
.big-choice .ic{width:36px;height:36px}
.big-choice.health{border-color:var(--health);color:var(--health)}
.big-choice.health b{color:var(--health)}
.big-choice.repose{border-color:var(--repose);color:var(--repose);background:#F3F1F7}
.big-choice.repose b{color:var(--repose)}
.stat{display:flex;flex-direction:column;gap:2px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.stat b{font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted);line-height:1.3}
.todo{display:flex;gap:12px;align-items:flex-start}
.todo .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:#fff;font-weight:700;font-size:14px}
.msg{border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.4;max-width:92%}
.msg.tg{background:#E7F1FB;border:1px solid #CFE0F3}
.msg.vb{background:#EFE9FA;border:1px solid #DDD2F1}
.msg small{display:block;margin-bottom:2px;font-weight:700;font-size:12px;color:#51627a}
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;font-weight:600;color:#5a5346}
.flow b{padding:3px 9px;border-radius:8px;background:#ECE7DC}
.flow b.on{background:var(--primary);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.schema-item{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 14px;border:0;border-top:1px solid var(--line);background:transparent;width:100%;text-align:left;cursor:pointer;font-size:15.5px}
.schema-item:first-child{border-top:0}
.schema-item span{flex:1}
.schema-item .n{font-style:normal;flex:none;width:24px;color:#8a8477;font-variant-numeric:tabular-nums;font-size:13px}
.q{display:flex;gap:12px}
.q .n{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:#EEF3F9;color:var(--primary);font-weight:700;font-size:14px}
a.link{color:var(--primary);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* Аркуш пояснень */
.sheet-wrap{position:absolute;inset:0;z-index:15;display:none;background:rgba(10,12,20,.45)}
.sheet-wrap.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:82%;overflow-y:auto;background:#fff;border-radius:20px 20px 0 0;padding:10px 18px 24px;display:flex;flex-direction:column;gap:12px;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet .grab{align-self:center;width:44px;height:5px;border-radius:5px;background:#D8D1C3;margin-bottom:4px}
.sheet h3{font-size:19px}
.sheet ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%) translateY(10px);z-index:16;width:max-content;max-width:86%;padding:10px 16px;border-radius:12px;background:#22262f;color:#fff;font-size:14px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translateX(-50%)}
:where(button,a,[tabindex]):focus-visible{outline:3px solid #E9B85C;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important;animation:none !important}}

/* v0.2: живі поля, пошук парафії, календар, QR */
.inp{width:100%;min-height:50px;padding:0 14px;border:1.5px solid #CFC7B8;border-radius:12px;background:#fff;color:#1C1C1C;font:inherit;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(31,58,95,.15)}
.inp::placeholder{color:#8a8477}
.illus{display:block;width:100%;max-width:300px;height:auto;margin:0 auto;color:var(--primary)}
.thumb{flex:none;width:54px;height:34px;color:var(--primary)}
.locate{display:flex;align-items:center;gap:14px}
.pulse{position:relative;flex:none;width:44px;height:44px;display:grid;place-items:center;color:var(--primary)}
.pulse::before,.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--primary);opacity:0;animation:ping 1.4s ease-out infinite}
.pulse::after{animation-delay:.7s}
@keyframes ping{0%{transform:scale(.4);opacity:.7}100%{transform:scale(1.6);opacity:0}}
.card.found{border:2px solid var(--primary);animation:rise .35s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.minimap{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line);background:#EEF1EA}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:12px;font-weight:700;color:#6b665c;text-align:center;padding:2px 0 4px}
.cal button{position:relative;height:42px;border:1.5px solid transparent;border-radius:10px;background:transparent;font-weight:600;font-size:15px;cursor:pointer;font-variant-numeric:tabular-nums;padding:0}
.cal button.fast{background:#F1ECF6}
.cal button.sun{color:var(--bad)}
.cal button.feast::after{content:"";position:absolute;left:50%;bottom:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--gold)}
.cal button.today{border-color:var(--primary)}
.cal button[aria-pressed="true"]{background:var(--primary);color:#fff}
.cal button[aria-pressed="true"].feast::after{background:#fff}
.scan{position:relative;width:200px;height:200px;margin:2px auto;border-radius:16px;background:#1b1e27;overflow:hidden}
.scan::before{content:"";position:absolute;inset:24px;border:3px solid #fff;border-radius:12px;opacity:.9}
.scan::after{content:"";position:absolute;left:28px;right:28px;top:30px;height:3px;background:#E9B85C;box-shadow:0 0 12px #E9B85C;animation:scan 1.8s ease-in-out infinite alternate}
@keyframes scan{to{top:167px}}
.qr{display:block;width:176px;height:176px}
a.chip{text-decoration:none}
.kv a.link{font-weight:700}

/* v0.3: введення імен, сповіщення, живі стани, переходи */
.addrow{display:flex;gap:8px}
.addrow .inp{flex:1;min-width:0}
.addrow .btn{flex:none;padding:0 14px}
textarea.inp{min-height:96px;padding:12px 14px;line-height:1.4;resize:none}
.err{min-height:0;margin:0;font-size:13.5px;font-weight:600;color:var(--bad)}
.err:empty{display:none}
.hintline{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted)}
.tagrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.tagrow .chip{min-height:38px;padding:0 13px;font-size:14px}
.chip.name{animation:pop .22s ease-out}
.chip.name i{font-style:normal;font-weight:500;color:#6b665c}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.empty-names{padding:12px 14px;border:1.5px dashed #CFC7B8;border-radius:12px;color:#7a7468;font-size:14px;text-align:center}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{position:relative}
.badge{position:absolute;top:6px;right:5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#E9B85C;color:#1d1406;font-size:11px;font-weight:800;line-height:18px;text-align:center;box-shadow:0 0 0 2px var(--primary)}
.unread{flex:none;width:9px;height:9px;border-radius:50%;background:var(--gold)}
.strip.off{background:#FBEFD9;color:var(--warn);font-weight:600}
.row.past{opacity:.5}
.new-mark{background:#FFF3D1;border-radius:6px;padding:0 4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.book-line{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.book-line + .book-line{border-top:1px dashed var(--line);padding-top:8px}
.content.push{animation:pushIn .22s ease-out}
.content.pop{animation:popIn .22s ease-out}
.content.fade{animation:fadeIn .18s ease-out}
@keyframes pushIn{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes popIn{from{transform:translateX(-24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:.3}to{opacity:1}}
.btn:active,.chip:active,.big-choice:active,.row:active{transform:scale(.985)}
.going{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.avatars{display:flex}
.avatars i{width:26px;height:26px;border-radius:50%;border:2px solid #fff;margin-left:-8px;background:#D9E3EF}
.avatars i:first-child{margin-left:0}
.avatars i:nth-child(2){background:#EAD9B0}
.avatars i:nth-child(3){background:#E3F1E8}
.avatars i.me{background:var(--primary)}
/* Режим показу: без позначок прототипу */
html.clean .meta{display:none !important}
.card.ref{border-color:#D5E0EE;background:#F5F8FC}
@media (max-width:380px){.topbar .icon-btn{width:38px}.topbar .mark{margin:0 4px 0 2px}}
.sheet p .ic{display:inline-block;width:18px;height:18px;vertical-align:-3px}

</style>
</head>

    pchannels: ['Telegram, Viber, соцмережі й сайт підключає парафія, а не вірянин. Оголошення розходяться туди автоматично.', ['Які канали має ваша парафія і хто їх веде?']],

  };

  /* ---------- Каркас і навігація ---------- */
  const el = document.getElementById('app');
  document.documentElement.classList.toggle('clean', S.clean);
  const shell = window.AndroidShell;
  const cur = () => S.stack[S.stack.length - 1];
  const TABS = [['parish', 'church', 'Парафія'], ['pray', 'book', 'Молитва'], ['community', 'people', 'Громада'], ['give', 'heart', 'Пожертви'], ['profile', 'user', 'Профіль']];
  const PTABS = [['priest', 'list', 'Огляд'], ['pbook', 'doc', 'Записки'], ['ppost', 'mega', 'Оголошення'], ['pmore', 'more', 'Ще']];
  function render(keepScroll){
    const id = cur(), sc = SC[id], mode = sc.mode || 'user';
    const title = typeof sc.title === 'function' ? sc.title() : sc.title;
    const isRoot = S.stack.length === 1;
    const prevScroll = keepScroll ? (el.querySelector('.content') || {}).scrollTop : 0;
    const showTabs = mode === 'user' && sc.tabs !== false;
    const tabOf = sc.tab || S.lastTab || 'parish';
    el.innerHTML = `
      <header class="topbar">${isRoot ? MARK : `<button class="icon-btn" type="button" data-act="back" aria-label="Назад">${ic('back')}</button>`}<h1>${title}</h1>
        ${isRoot && mode === 'user' ? `<button class="icon-btn" type="button" data-act="jump" data-arg="inbox" aria-label="Сповіщення${unread() ? `: нових ${unread()}` : ''}">${ic('bell')}${unread() ? `<span class="badge">${unread()}</span>` : ''}</button>` : ''}
        ${S.clean ? '' : `<button class="icon-btn" type="button" data-act="note" aria-label="Про цей екран">${ic('info')}</button>
        <button class="icon-btn" type="button" data-act="jump" data-arg="schema" aria-label="Схема застосунку">${ic('grid')}</button>`}</header>
      ${S.clean ? (mode === 'priest' ? '<div class="strip priest">Кабінет пароха · Парафія св. Миколая</div>' : '') : `<div class="strip${mode === 'priest' ? ' priest' : ''}">${mode === 'priest' ? 'Кабінет пароха · прототип, демо-парафія' : `«${APP}» · прототип для обговорення`}</div>`}
      ${S.offline ? `<div class="strip off">Немає зв'язку · показано збережене о ${S.offSince}</div>` : ''}
      <main class="content${navAnim ? ' ' + navAnim : ''}" id="content">${cleanHtml(sc.r())}</main>
      ${showTabs ? `<nav class="tabs" aria-label="Розділи">${TABS.map(t => `<button type="button" data-tab="${t[0]}" ${tabOf === t[0] ? 'aria-current="page"' : ''}>${ic(t[1])}${t[2]}</button>`).join('')}</nav>` : ''}
      ${mode === 'priest' ? `<nav class="tabs priest" aria-label="Кабінет">${PTABS.map(t => `<button type="button" data-ptab="${t[0]}" ${sc.ptab === t[0] ? 'aria-current="page"' : ''}>${ic(t[1])}${t[2]}</button>`).join('')}</nav>` : ''}
      <div class="sheet-wrap" id="sheet"></div><div class="toast" id="toast" role="status"></div>`;
    navAnim = '';
    if (keepScroll) el.querySelector('.content').scrollTop = prevScroll;
  }
  let navAnim = '';
  function go(id, arg){ if (!SC[id]) return; if (arg != null) S.args[id] = arg; S.stack.push(id); navAnim = 'push'; render(); if (id === 'inbox') S.inbox.forEach(x => { if (x.all || x.parish === S.parish) x.unread = false; }); }
  function tab(id){ S.entered = true; S.lastTab = id; S.stack = [id]; navAnim = 'fade'; render(); }
  function back(){ if (S.stack.length > 1){ S.stack.pop(); navAnim = 'pop'; render(); return true; } return false; }
  /* Завершити потік: замість форми в історії лишається корінь вкладки й екран результату */
  function finish(id){ S.stack = [S.lastTab || 'parish', id]; navAnim = 'push'; render(); }
  let toastT = 0, nearT = 0;
  function toast(t){ const x = document.getElementById('toast'); if (!x) return; x.textContent = S.clean ? String(t).replace(/\s*\((демо|приклад)\)/g, '') : t; x.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => x.classList.remove('on'), 2200); }
  function openSheet(html, label){
    const w = document.getElementById('sheet');
    w.innerHTML = `<div class="sheet" role="dialog" aria-label="${label}"><div class="grab"></div>${html}</div>`;
    w.classList.add('on'); const x = document.getElementById('toast'); if (x) x.classList.remove('on');
  }
  const closeSheet = () => { const w = document.getElementById('sheet'); if (w && w.classList.contains('on')){ w.classList.remove('on'); return true; } return false; };
  const afterIntro = () => { if (S.entered) back(); else go('pick'); };

  /* Імена вводить вірянин: по одному або через кому; без прізвищ, цифр і дублікатів */
  function addNames(raw){
    const parts = String(raw || '').split(/[,;\n]+/).map(x => x.trim().replace(/\s+/g, ' ')).filter(Boolean);
    if (!parts.length) return 'Введіть хресне ім\'я.';
    const add = [];
    for (const p of parts){
      if (p.includes(' ')) return `«${p}»: лише хресне ім'я, без прізвища. Кілька імен додавайте по одному або через кому.`;
      if (!NAME_RE.test(p)) return `«${p}»: ім'я пишемо літерами, без цифр і знаків.`;
      if (p.replace(/[-'’ʼ]/g, '').length < 2) return `«${p}»: надто коротко для імені.`;
      const n = p.split('-').map(w => w.charAt(0).toLocaleUpperCase('uk') + w.slice(1).toLocaleLowerCase('uk')).join('-');
      const key = n.toLocaleLowerCase('uk') + '|' + (S.note.tag || '');
      if (S.note.names.some(x => x.n.toLocaleLowerCase('uk') + '|' + (x.tag || '') === key) || add.some(x => x.n.toLocaleLowerCase('uk') + '|' + x.tag === key)) return `«${n}» уже є в записці.`;
      add.push({ n, tag: S.note.tag || '' });
    }
    if (S.note.names.length + add.length > MAX_NAMES) return `В одній записці до ${MAX_NAMES} імен. Для інших подайте ще одну записку.`;
    S.note.names.push(...add); S.note.tag = '';
    return '';
  }
  function submitNote(){
    const o = curWhen();
    const n = { parish: S.parish, type: S.note.type, how: S.note.how, names: S.note.names.slice(), text: S.note.text.trim(), day: o.day, whenLabel: o.l, sorok: !!o.sorok,
      sum: S.note.noGift ? 0 : S.note.sum, noGift: S.note.noGift, status: S.offline ? 'queued' : o.sorok ? 'running' : 'inlist' };
    S.notes.unshift(n); S.noteSel = 0;
    S.note = { type: n.type, how: HOW[n.type][0], names: [], tag: '', text: '', pending: '', when: 0, sum: 100, custom: false, noGift: false };
    if (S.offline) toast('Збережено. Надішлемо, щойно з\'явиться зв\'язок.');
    return n;
  }

  const ACT = {
    back: () => back(), closesheet: () => closeSheet(),
    note: () => { const n = NOTE[cur()] || ['', []]; openSheet(`<h3>Про цей екран</h3><p>${n[0]}</p>${n[1].length ? `<p class="sec" style="margin:4px 0 0">Питання до парохів</p><ul>${n[1].map(q => `<li>${q}</li>`).join('')}</ul>` : ''}${btn('Зрозуміло', { block: 1, act: 'closesheet' })}`, 'Про цей екран'); },
    dead: () => toast(S.clean ? 'Цей розділ ще готується.' : 'Це схема: дія не підключена.'),
    toast: a => toast(a), toastback: a => { back(); toast(a); },
    jump: a => { if (cur() !== a) go(a); },
    signup: () => { const f = document.getElementById('fname'); S.name = esc(((f && f.value) || '').trim()); S.signed = true; afterIntro(); toast('Номер підтверджено кодом (демо).'); },
    guest: () => afterIntro(),
    country: a => { S.country = a === 'Україна' ? 'ua' : 'di'; S.found = false; render(true); },
    near: () => { if (S.locating) return; S.locating = true; S.found = false; S.country = 'ua'; render(); clearTimeout(nearT); nearT = setTimeout(() => { S.locating = false; S.found = true; if (cur() === 'pick') render(); }, 1700); },
    qr: () => openSheet(`<h3>QR-код у храмі</h3><p class="small muted">Наведіть камеру на код на дверях храму або на дошці оголошень.</p><div class="scan"></div>${btn('Імітувати сканування', { block: 1, act: 'qrfound' })}`, 'Сканування QR-коду'),
    qrfound: () => { closeSheet(); ACT.choose(1); toast('Знайдено за кодом: Парафія св. Миколая (приклад).'); },
    choose: a => { const was = S.entered; S.parish = +a; S.locating = false; S.found = false; S.q = ''; S.gift.to = ''; tab('parish'); if (was) toast('Парафію змінено.'); },
    calday: a => { S.calDay = +a; render(true); },
    home: () => tab('parish'),
    notif: () => { S.notif = !S.notif; render(true); },
    big: () => { S.big = !S.big; document.documentElement.classList.toggle('big', S.big); render(true); },
    giftsum: a => { if (a === 'Інша сума'){ S.gift.custom = true; render(true); const f = document.getElementById('gsumc'); if (f) f.focus(); } else { S.gift.custom = false; S.gift.sum = parseInt(a) || 200; render(true); } },
    giftmode: a => { S.gift.monthly = a === 'Щомісячна'; render(true); },
    giftto: a => { Object.assign(S.gift, { to: a || '', fund: (a || '').indexOf('Збір') === 0, fromNote: false, custom: false, monthly: false, sum: 200 }); go('gift'); },
    giftgo: () => { if (S.gift.custom){ const v = parseInt(S.gift.customVal, 10); if (!(v >= 10 && v <= 100000)){ toast('Вкажіть суму від 10 до 100 000 ₴.'); const f = document.getElementById('gsumc'); if (f) f.focus(); return; } S.gift.sum = v; } go('giftpay'); },
    giftok: () => {
      const g = S.gift;
      S.gifts.unshift({ parish: S.parish, to: g.to || pName(), sum: g.sum, monthly: g.monthly, when: 'сьогодні', fund: g.fund, note: g.fromNote });
      if (g.fund){ S.fundSum += g.sum; S.fundCount++; }
      if (g.fromNote){ submitNote(); return finish('notedone'); }
      finish('giftdone');
    },
    ntype: a => { S.note.tag = ''; S.note.type = a; S.note.how = HOW[a][0]; S.note.when = 0; go('note2'); setTimeout(() => { const f = document.getElementById(a === 'intent' ? 'ntext' : 'nname'); if (f && matchMedia('(pointer:fine)').matches) f.focus(); }, 60); },
    nhow: a => { S.note.how = a; S.note.when = 0; render(true); },
    nwhen: a => { S.note.when = +a; render(true); },
    ntag: a => { S.note.tag = S.note.tag === a ? '' : a; document.querySelectorAll('[data-act="ntag"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.arg === S.note.tag))); const f = document.getElementById('nname'); if (f) f.focus(); },
    nadd: () => {
      const f = document.getElementById('nname'), e = document.getElementById('nerr'); if (!f) return;
      const err = addNames(f.value);
      if (err){ e.textContent = err; f.focus(); return; }
      f.value = ''; S.note.pending = ''; e.textContent = '';
      document.getElementById('nlist').innerHTML = nlistHtml();
      document.querySelectorAll('[data-act="ntag"]').forEach(b => b.setAttribute('aria-pressed', 'false'));
      f.focus();
    },
    ndel: a => { S.note.names.splice(+a, 1); const l = document.getElementById('nlist'); if (l) l.innerHTML = nlistHtml(); },
    nnext: () => {
      if (S.note.type === 'intent'){
        if (S.note.text.trim().length < 3){ toast('Напишіть, за кого або за що молитися.'); const t = document.getElementById('ntext'); if (t) t.focus(); return; }
        return go('note3');
      }
      const f = document.getElementById('nname'), e = document.getElementById('nerr');
      if (f && f.value.trim()){ const err = addNames(f.value); if (err){ e.textContent = err; f.focus(); return; } S.note.pending = ''; }
      if (!S.note.names.length){ e.textContent = 'Додайте хоча б одне ім\'я.'; if (f) f.focus(); return; }
      go('note3');
    },
    nsum: a => { if (a === 'Інша сума'){ S.note.custom = true; render(true); const f = document.getElementById('nsumc'); if (f) f.focus(); } else { S.note.custom = false; S.note.sum = parseInt(a) || 100; render(true); } },
    ngift: a => {
      S.note.noGift = a === '0';
      if (!S.note.noGift && S.note.custom){ const v = parseInt(S.note.customVal, 10); if (!(v >= 10 && v <= 100000)){ toast('Вкажіть суму від 10 до 100 000 ₴ або подайте без пожертви.'); return; } S.note.sum = v; }
      go('note4');
    },
    nedit: a => { const i = S.stack.lastIndexOf(a); if (i > 0){ S.stack = S.stack.slice(0, i + 1); navAnim = 'pop'; render(); } else go(a); },
    nsubmit: () => {
      if (S.note.noGift){ submitNote(); return finish('notedone'); }
      Object.assign(S.gift, { sum: S.note.sum, custom: false, monthly: false, to: `Пожертва до записки · ${shortP(S.parish)}`, fund: false, fromNote: true });
      go('giftpay');
    },
    nofflinesave: () => { S.note.noGift = true; submitNote(); finish('notedone'); },
    mynotes: () => finish('notes'),
    nopen: a => { S.noteSel = +a; go('notedetail'); },
    nrepeat: a => { const n = S.notes[+a]; if (!n) return; S.parish = n.parish; S.note = { type: n.type, how: n.how, names: n.names.map(x => Object.assign({}, x)), tag: '', text: n.text, pending: '', when: 0, sum: n.sum || 100, custom: false, noGift: false }; go('note2'); toast('Імена перенесено. Оберіть дату.'); },
    ncancel: a => { S.notes.splice(+a, 1); S.noteSel = 0; back(); toast('Записку скасовано.'); },
    rsvp: a => { S.rsvp[a] = !S.rsvp[a]; render(true); toast(S.rsvp[a] ? 'Чекаємо на вас! Організатор бачить лише кількість (демо).' : 'Скасовано.'); },
    vol: () => { S.vol = !S.vol; render(true); toast(S.vol ? 'Дякуємо! Координатор зв\'яжеться з вами (демо).' : 'Відгук скасовано.'); },
    group: () => { S.groupReq = !S.groupReq; render(true); if (S.groupReq) toast('Заявку передано провідниці спільноти (демо).'); },
    rtype: a => { S.req.type = a; document.querySelectorAll('[data-act="rtype"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.arg === a))); const e = document.getElementById('rerr'); if (e) e.textContent = ''; },
    rsend: () => {
      const e = document.getElementById('rerr');
      if (!S.req.type){ e.textContent = 'Оберіть, з чим звертаєтеся.'; return; }
      if (!S.signed && S.req.phone.replace(/\D/g, '').length < 9){ e.textContent = 'Вкажіть номер телефона, щоб парох міг зв\'язатися.'; const f = document.getElementById('rphone'); if (f) f.focus(); return; }
      S.reqs.unshift({ parish: S.parish, type: S.req.type, text: S.req.text.trim(), who: S.name || '', status: S.offline ? 'queued' : 'new' });
      S.req = { type: '', text: '', phone: '' };
      finish('reqdone');
    },
    rdone: a => { const r = S.reqs[+a]; if (!r) return; r.status = 'done'; if (!r.ex) pushInbox({ parish: r.parish, t: 'Парох отримав ваше звернення', s: `${r.type} · очікуйте дзвінка`, go: 'parish' }); render(true); toast(r.ex ? 'Позначено (демо).' : 'Позначено. Вірянин отримає сповіщення (демо).'); },
    inboxgo: a => { const x = S.inbox[+a]; if (!x) return; x.unread = false; if (x.note){ const i = S.notes.indexOf(x.note); if (i >= 0){ S.noteSel = i; return go('notedetail'); } } if (x.go === 'parish') return tab('parish'); go(x.go, x.arg); },
    offline: () => {
      S.offline = !S.offline;
      if (S.offline){ S.offSince = nowHM(); render(true); toast('Демо: зв\'язку немає. Розклад і оголошення — зі збереженого.'); return; }
      const q = S.notes.filter(n => n.status === 'queued'), rq = S.reqs.filter(r => r.status === 'queued');
      q.forEach(n => { n.status = n.sorok ? 'running' : 'inlist'; }); rq.forEach(r => { r.status = 'new'; });
      render(true);
      toast(q.length || rq.length ? `Зв'язок є: надіслано ${[q.length ? plural(q.length, F_NOTES) : '', rq.length ? plural(rq.length, ['звернення', 'звернення', 'звернень']) : ''].filter(Boolean).join(' і ')}.` : 'Зв\'язок відновлено.');
    },
    schematab: a => { S.schemaTab = a === 'Схема' ? 'map' : 'q'; render(); },
    priestin: () => { S.stack = ['priest']; navAnim = 'fade'; render(); toast('Вхід виконано (демо).'); },
    priestbook: a => { S.bookDay = +a || 17; S.stack = ['pbook']; navAnim = 'fade'; render(); },
    user: () => tab(S.lastTab || 'parish'),
    viewas: () => { closeSheet(); S.parish = 1; S.entered = true; tab('parish'); toast('Вигляд парафіянина: Парафія св. Миколая (приклад).'); },
    chan: a => { S.chan[a] = !S.chan[a]; render(true); },
    served: () => {
      const d = S.bookDay; S.served[d] = !S.served[d];
      const mine = myBook(1, d).filter(n => !n.sorok);
      if (S.served[d]){
        const hit = mine.filter(n => n.status === 'inlist');
        hit.forEach(n => { n.status = 'served'; pushInbox({ parish: 1, t: 'Відслужено', s: `${TYPE[n.type][0]}: ${noteTitle(n)} · ${n.whenLabel}`, note: n }); });
        render(true);
        toast(hit.length ? `Позначено. ${hit.length === 1 ? 'Вірянин отримає' : 'Віряни отримають'} сповіщення «Відслужено» (демо).` : 'Позначено: відслужено (демо).');
      } else { mine.filter(n => n.status === 'served').forEach(n => { n.status = 'inlist'; }); render(true); }
    },
    bookday: a => { S.bookDay = +a; render(true); },
    pphoto: () => { S.paper.photo = true; render(true); toast('Фото додано (демо).'); },
    ptype: a => { S.paper.type = a; render(true); },
    pday: a => { S.bookDay = +a; render(true); },
    psave: () => {
      if (!S.paper.photo){ toast('Спершу сфотографуйте аркуш.'); return; }
      S.papers.push({ day: S.bookDay, type: S.paper.type, sum: parseInt(S.paper.sum, 10) || 0 });
      S.paper = { type: 'health', sum: '', photo: false };
      back(); toast(`Записку внесено до списку на ${DAYNAME[S.bookDay]} (демо).`);
    },
    ppublish: () => {
      const txt = S.ptext.trim(); if (txt.length < 5){ toast('Напишіть текст оголошення.'); return; }
      const [h, b] = splitPost(txt), id = 'm' + Date.now();
      S.myPosts.unshift({ id, t: esc(h), s: 'від пароха', when: 'щойно', date: '16 листопада', body: (b || txt).split(/\n+/).filter(Boolean).map(esc), mine: 1 });
      pushInbox({ parish: 1, t: 'Нове оголошення', s: esc(h), go: 'post', arg: id });
      const ch = [S.chan.tg ? 'Telegram' : '', S.chan.vb ? 'Viber' : '', S.chan.site ? 'сайт парафії' : ''].filter(Boolean);
      openSheet(`<h3>Опубліковано</h3><p class="small">У застосунку і на сторінці парафії${ch.length ? `, а також: ${ch.join(', ')}` : ''} (демо). Віряни парафії отримали сповіщення.</p>${btn('Подивитися як парафіянин', { block: 1, act: 'viewas', icon: 'user' })}${btn('Залишитися в кабінеті', { k: 'quiet', block: 1, act: 'closesheet' })}`, 'Опубліковано');
    },
    clean: () => { S.clean = !S.clean; document.documentElement.classList.toggle('clean', S.clean); render(true); toast(S.clean ? 'Режим показу: без позначок прототипу.' : 'Режим обговорення: позначки, ⓘ і схема з питаннями.'); },
    install: () => {
      if (installEvt){ const e = installEvt; e.prompt(); e.userChoice.then(() => { installEvt = null; render(true); }).catch(() => {}); return; }
      openSheet(`<h3>Додати на головний екран</h3><p class="small"><b>iPhone:</b> у Safari натисніть «Поділитися» ${ic('ext')} → «На початковий екран».</p><p class="small"><b>Android:</b> у Chrome відкрийте меню ⋮ → «Встановити застосунок» або «Додати на головний екран».</p><p class="small muted">Після цього «Дзвін» відкривається як звичайний застосунок і працює без інтернету.</p>${btn('Зрозуміло', { block: 1, act: 'closesheet' })}`, 'Додати на головний екран');
    },
    restart: () => { location.reload(); }
  };
  el.addEventListener('click', e => {
    const w = document.getElementById('sheet');
    if (w && e.target === w){ closeSheet(); return; }
    const t = e.target.closest('[data-go],[data-tab],[data-ptab],[data-act]'); if (!t || !el.contains(t)) return;
    const d = t.dataset || {};
    if (d.tab) return tab(d.tab);
    if (d.ptab){ S.stack = [d.ptab]; return render(); }
    if (d.go) return go(d.go, d.arg);
    const f = ACT[d.act]; if (f) f(d.arg);
  });
  el.addEventListener('input', e => {
    const id = e.target.id, v = e.target.value;
    if (id === 'q'){ S.q = esc(v); const l = document.getElementById('plist'); if (l) l.innerHTML = plist(); }
    if (id === 'fname') S.name = esc(v);
    if (id === 'nname'){ S.note.pending = v; const er = document.getElementById('nerr'); if (er && er.textContent) er.textContent = ''; }
    if (id === 'ntext'){ S.note.text = v; const c = document.getElementById('ncount'); if (c) c.textContent = `${v.length}/160`; }
    if (id === 'gsumc') S.gift.customVal = v;
    if (id === 'nsumc') S.note.customVal = v;
    if (id === 'rtext'){ S.req.text = v; const c = document.getElementById('rcount'); if (c) c.textContent = `${v.length}/300`; }
    if (id === 'rphone') S.req.phone = v;
    if (id === 'psum') S.paper.sum = v;
    if (id === 'ptext'){ S.ptext = v; const c = document.getElementById('pcount'); if (c) c.textContent = `${v.length}/600`; const a = document.getElementById('pvapp'); if (a) a.innerHTML = pvApp(); el.querySelectorAll('.pv').forEach(x => { x.textContent = v; }); }
  });
  el.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing) return;
    if (e.target.id === 'nname'){ e.preventDefault(); ACT.nadd(); }
    if (e.target.id === 'gsumc'){ e.preventDefault(); ACT.giftgo(); }
    if (e.target.id === 'nsumc'){ e.preventDefault(); ACT.ngift('1'); }
  });
  /* «Наступна служба» оновлюється щохвилини, поки людина на сторінці парафії */
  setInterval(() => { const a = document.activeElement; if (cur() === 'parish' && !document.querySelector('.sheet-wrap.on') && !(a && /INPUT|TEXTAREA/.test(a.tagName))) render(true); }, 60000);
  window.appBack = () => {
    if (typeof Intro !== 'undefined' && Intro.isAlive()) return false;
    if (closeSheet()) return true;
    if (back()) return true;
    const id = cur();
    if (SC[id].mode === 'priest'){ if (id !== 'priest'){ S.stack = ['priest']; render(); } else ACT.user(); return true; }
    if (S.entered && id !== 'parish'){ tab('parish'); return true; }
    return false;
  };
  /* Вебзастосунок (PWA): кнопка «Назад» телефона веде по екранах, а не закриває застосунок */
  if (PWA){
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (cur() === 'profile') render(true); });
    window.addEventListener('appinstalled', () => { installEvt = null; if (cur() === 'profile') render(true); toast('«Дзвін» додано на головний екран.'); });
    try { history.replaceState({ dz: 0 }, ''); history.pushState({ dz: 1 }, ''); } catch (e) {}
    window.addEventListener('popstate', () => { if (window.appBack()) history.pushState({ dz: 1 }, ''); else history.back(); });
  }
  function start(){
    document.documentElement.classList.toggle('clean', S.clean);
    render();
    try { if (shell && shell.setBars) shell.setBars('#1F3A5F', '#FFFFFF', true, false); } catch (e) {}
    const tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.setAttribute('content', '#1F3A5F');
  }
  return { start, go, tab, render, S, SC, NOTE, ACT };
})();

App.render();
Intro.start(() => App.start());
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
